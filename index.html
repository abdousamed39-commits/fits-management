<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FITS MANAGER</title>
</head>
<body>
  <p>Chargement de FITS MANAGER…</p>
  <script>
    fetch('https://raw.githubusercontent.com/abdousamed39-commits/fits-management/3aad6c001b4bff16c24ff39db75f66fe3f613527/index.html')
      .then(function (response) {
        if (!response.ok) throw new Error('Impossible de charger l’application.');
        return response.text();
      })
      .then(function (html) {
        var receiptHeader = '<div class="receipt-head"><h2>FITS MANAGER</h2><small>Fouta IT Services</small></div>';
        var receiptHeaderWithLogo = '<div class="receipt-head"><img src="logo.png" alt="Logo FITS" style="display:block;width:48px;height:auto;margin:0 auto 6px"><h2>FITS MANAGER</h2><small>Fouta IT Services</small></div>';
        if (!html.includes(receiptHeader)) throw new Error('En-tête du reçu introuvable.');
        document.open();
        document.write(html.replace(receiptHeader, receiptHeaderWithLogo));
        document.close();
      })
      .catch(function (error) {
        document.body.textContent = 'Erreur de chargement : ' + error.message;
      });
  </script>
</body>
</html>
